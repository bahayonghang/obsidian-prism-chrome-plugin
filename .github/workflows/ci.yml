# Modified 2026-11-22: validate the independent browser port. GPL-3.0-only.
name: Validate browser extension

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify reproducible archives
        run: |
          cp dist/SHA256SUMS /tmp/prism-first-build.sha256
          npm run build
          diff -u /tmp/prism-first-build.sha256 dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-prism-web-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  browser-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - name: Install optional browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install native window manager
        run: sudo apt-get install --no-install-recommends -y openbox x11-utils
      - run: xvfb-run -a --server-args="-screen 0 1600x1200x24" bash tests/with-window-manager.sh npm run test:browser
        env:
          PRISM_BROWSER: ${{ matrix.browser }}
          PRISM_ACTION_HEADED: ${{ matrix.browser == 'chromium' && '1' || '0' }}
          PRISM_EXTENSION_DIR: dist/${{ matrix.browser == 'chromium' && 'chrome' || 'firefox' }}
      - name: Install native Firefox popup tools
        if: matrix.browser == 'firefox'
        run: |
          python3 -m pip install selenium==4.53.0
          sudo apt-get install --no-install-recommends -y imagemagick
          mkdir -p "$RUNNER_TEMP/prism-geckodriver"
          curl --fail --location --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o "$RUNNER_TEMP/prism-geckodriver/archive.tar.gz"
          tar -xzf "$RUNNER_TEMP/prism-geckodriver/archive.tar.gz" -C "$RUNNER_TEMP/prism-geckodriver"
      - name: Verify native Firefox toolbar popup
        if: matrix.browser == 'firefox'
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x24" bash tests/with-window-manager.sh python3 tests/native-firefox-popup.py \
            --firefox-binary "$(node -p "require('playwright').firefox.executablePath()")" \
            --geckodriver "$RUNNER_TEMP/prism-geckodriver/geckodriver" \
            --extension-dir dist/firefox --artifact-dir test-artifacts/native-firefox
      - name: Save browser measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-fixtures-${{ matrix.browser }}
          path: test-artifacts/
          if-no-files-found: ignore
